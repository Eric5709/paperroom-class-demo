<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7fb"><meta name="description" content="PaperRoom: 논문의 그림·표·할 일·버전·피드백을 한곳에서 관리하세요."><title>PAPER ROOM — 논문 협업 공간</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div id="app" class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">P<span>·</span></div><div><b>paperroom<span class="brand-dot">.</span></b><small>논문 협업 공간</small></div></div>
    <div class="work-label">작업 공간</div>
    <button class="workspace-switch" id="workspace-switch"><div class="ws-logo">O</div><div class="ws-switch-text"><b id="workspace-name">OLIVE 논문 프로젝트</b><small id="workspace-sub">연구팀</small></div><span class="chev">⌄</span></button>
    <div class="nav-label">주요 메뉴</div>
    <nav id="nav">
      <button class="nav-item active" data-nav="dashboard"><span class="ni">◫</span> 개요 <span class="nav-dot"></span></button>
      <button class="nav-item" data-nav="artifacts"><span class="ni">▦</span> 그림 · 표 관리 <span class="nav-count" id="nav-art-count">0</span></button>
      <button class="nav-item" data-nav="tasks"><span class="ni">☑</span> 할 일 관리</button>
      <button class="nav-item" data-nav="activity"><span class="ni">◷</span> 작업 기록</button>
    </nav>
    <div class="nav-label space-label">공동 작업</div>
    <nav><button class="nav-item" data-nav="members"><span class="ni">♙</span> 공동저자 초대</button></nav>
    <div class="side-bottom"><div class="side-tip"><span>✦</span><b>기록은 간편하게.<br>연구는 깊이 있게.</b><small>논문의 맥락을 잃지 않는 협업 공간</small></div><div class="side-user"><div class="avatar" id="side-avatar">나</div><div><strong id="side-user-name">게스트 연구자</strong><small id="side-user-role">로그인 없이 사용 중</small></div><button id="edit-name" title="표시 이름 변경">✎</button></div></div>
  </aside>
  <div class="main-wrap"><header class="topbar"><div class="crumb">PaperRoom <span>/</span> <b id="crumb-current">개요</b></div><div class="top-actions"><span class="live-indicator"><i></i> 저장됨</span><button class="icon-button" id="refresh" title="새로고침">↻</button><button class="button secondary" id="top-invite">↗ &nbsp; 공동저자 초대</button></div></header><main id="content" class="content"><div class="loader">워크스페이스를 불러오는 중입니다…</div></main></div>
</div>
<div id="modal-root"></div><div id="toast-root" aria-live="polite"></div>
<script src="/app.js" defer></script>
</body></html>
